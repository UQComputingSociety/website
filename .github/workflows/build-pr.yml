name: Check Build On PR

on:
  pull_request:
    branches: [ '*' ]
    
jobs:
  check-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Build
        run: hugo --minify
